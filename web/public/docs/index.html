<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>ALFA FLOW API — OpenAPI</title><link rel="stylesheet" href="/docs/swagger-ui.css"/></head>
<body style="margin:0"><div id="swagger-ui"></div><script src="/docs/swagger-ui-bundle.js"></script><script>window.onload=function(){SwaggerUIBundle({url:'/api/openapi.yaml',dom_id:'#swagger-ui',deepLinking:true,persistAuthorization:false,requestInterceptor:function(req){if(req.method!=='GET'){req.headers['Idempotency-Key']=crypto.randomUUID();var token=sessionStorage.getItem('alfa_docs_csrf');if(token)req.headers['X-CSRF-Token']=token}return req},responseInterceptor:function(res){try{var data=JSON.parse(res.text);if(data.csrf_token)sessionStorage.setItem('alfa_docs_csrf',data.csrf_token)}catch(e){}return res}})}</script></body></html>
