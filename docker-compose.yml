name: alfa-flow
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: alfa_demo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_synthetic_only}
      POSTGRES_DB: alfa_flow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfa_demo -d alfa_flow"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://alfa_demo:${POSTGRES_PASSWORD:-local_synthetic_only}@postgres:5432/alfa_flow?sslmode=disable
      DEMO_MODE: "true"
      AI_ENABLED: "false"
      PUBLIC_ORIGIN: http://localhost:8088
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
